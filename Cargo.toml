[package]
name = "lilqueue"
version = "0.1.0"
edition = "2024"
description = "A small storage-agnostic async job queue runner"
license = "BSD-3-Clause"
repository = "https://github.com/nakajima/lilqueue"
readme = "README.md"
keywords = ["jobs", "queue", "async", "worker"]
categories = ["asynchronous"]
exclude = ["crates/*"]

[dependencies]
async-trait = "0.1"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.14"
tower = { version = "0.5", features = ["util"] }
